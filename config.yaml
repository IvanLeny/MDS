# =====================================================================
#  Configuration du prototype MINPMEESA (mémoire v5, chapitres 2 et 3)
#  Tout paramètre expérimental vit ici : aucune valeur n'est codée en dur.
# =====================================================================

graine: 42

chemins:
  corpus: data/corpus
  registre: data/corpus/registre.yaml
  base: data/base                 # base SQLite + index (reconstructibles, hors Git)
  lexique: data/lexique/synonymes.yaml
  appariement: data/pairing
  gold: data/gold
  resultats: data/results
  sorties: data/outputs
  modeles: models

# ---------------------------------------------------------------------
#  Ingestion (2.3, 3.2)
# ---------------------------------------------------------------------
ingestion:
  passage_tokens_min: 400         # taille des passages de texte (tokens)
  passage_tokens_max: 800
  recouvrement: 0.15              # 10 à 20 % de recouvrement
  passage_tokens_plancher: 20     # en dessous : fragment rejeté (bruit)
  lignes_courantes_ratio: 0.3     # ligne répétée sur >= 30 % des pages = en-tête/pied

# ---------------------------------------------------------------------
#  Encodeur (Tableau 3.3)
# ---------------------------------------------------------------------
embeddings:
  modele: BAAI/bge-m3             # principal
  candidats:
    - BAAI/bge-m3
    - intfloat/multilingual-e5-large
    - dangvantuan/sentence-camembert-base
  repli_leger: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  # Si aucun modèle n'est présent dans models/embeddings, le programme utilise
  # un encodeur hors ligne TF-IDF + SVD (signalé dans toutes les sorties).
  repli_hors_ligne_dims: 256
  taille_lot: 16

# ---------------------------------------------------------------------
#  Service 1 : consultation (3.2.5)
# ---------------------------------------------------------------------
consultation:
  k_bm25: 50
  k_dense: 50
  rrf_k: 60                       # ablation : 10, 20, 60
  rrf_k_ablation: [10, 20, 60]
  top_n: 5
  expansion_lexique: true
  max_synonymes_par_terme: 4
  poids_expansion: 0.3            # poids des termes ajoutés par le lexique (fixé a priori)
  signal_abstention: dense_max    # bm25_max | dense_max : choisi sur le jeu H1 (4 combinaisons comparées, voir resultats.json)
  seuil_abstention: 0.489  # calibré (evaluation.h1_recuperation, validation croisée)
  # Le signal (cosinus dense) dépend de l'encodeur : un seuil calibré par encodeur.
  # `seuil_abstention` sert si l'encodeur de la base n'est pas listé ici.
  seuils_par_encodeur:
    "repli-hors-ligne-tfidf-svd": 0.489   # run du 28/09/2026
    "BAAI/bge-m3": 0.621                  # run du 30/09/2026 (Colab), validation croisée 5 plis
  # Critère de calibration : « refus_a_tort_max » = seuil le plus haut qui refuse
  # au plus `refus_a_tort_max` des questions du corpus (un refus à tort prive
  # l'utilisateur d'une source ; une réponse hors sujet ne montre que des passages
  # sourcés, sans texte inventé). « equilibre » = exactitude équilibrée.
  critere_calibration: refus_a_tort_max
  refus_a_tort_max: 0.05
  reponse_redigee: false          # réponse rédigée courte facultative

# ---------------------------------------------------------------------
#  Appariement (2.3.2)
# ---------------------------------------------------------------------
appariement:
  poids_intitule: 0.5
  poids_valeurs: 0.5
  seuil_candidat: 0.35            # en dessous : « a_verifier »
  seuil_code_stable: 0.55         # similarité d'intitulés pour réutiliser un code d'une édition à l'autre
  # Statuts utilisables par les services tant que la validation humaine n'est
  # pas faite. Toute sortie fondée sur un « candidat » est marquée PROVISOIRE.
  statuts_utilisables: [valide, candidat]
  statuts_evaluation: [valide]
  repli_evaluation_candidats: true  # si aucune ligne validée : candidats, résultats PROVISOIRES

# ---------------------------------------------------------------------
#  Service 2 : commentaire (3.2.4, 3.3)
# ---------------------------------------------------------------------
commentaire:
  nb_modeles_redaction: 3         # commentaires antérieurs fournis comme modèles
  max_valeurs_contexte: 120
  decimales_pct: 1                # convention : 1 décimale pour les %
  annees_exclues: [2010, 2035]    # bornes des millésimes non contrôlés
  longueur_min_enonce: 5          # mots, après retrait d'une valeur (R3)
  # « Évolution la plus marquée » : une variation en % n'est retenue que si la valeur de
  # référence est assez grande (sinon +300 % sur 7 unités) ; fixé a priori.
  effectif_min_evolution: 50
  part_min_evolution: 0.01        # et au moins 1 % du total de l'indicateur
  # Repli (interface et notes) : si la réponse du modèle de langage est inexploitable, le
  # commentaire est rédigé par les gabarits, et le repli est signalé. Les évaluations du modèle
  # (H1, H2, Tableau 3.2) le désactivent pour mesurer le modèle seul.
  repli_gabarits: true
  repli_min_constats: 2           # en dessous, la rédaction du modèle est jugée trop pauvre

# ---------------------------------------------------------------------
#  Modèle de langage (Tableau 3.2)
# ---------------------------------------------------------------------
llm:
  # Double moteur (section 2.2.2) : une interface, deux moteurs, choisis ici sans toucher au code.
  #   ollama : moteur CIBLE du déploiement, local, sans réseau ;
  #   api    : service distant compatible OpenAI (Groq), DÉVELOPPEMENT uniquement, documents publics,
  #            modèle à poids ouverts identique à un modèle Ollama (résultats transposables) ;
  #   none   : sans modèle de langage (gabarits déterministes, signalé) ;
  #   llamacpp : repli local si Ollama est absent (fichier GGUF).
  backend: ollama
  temperature: 0
  nouvelles_tentatives_json: 1
  ollama:
    modele: gpt-oss:20b           # retenu (option A) = mêmes poids ouverts que Groq openai/gpt-oss-20b
    url: http://127.0.0.1:11434   # Ollama local uniquement
    delai_max_s: 900              # modèle 20B sur CPU : plusieurs minutes par commentaire
    candidats:                    # Tableau 3.2, comparés si le temps et la connexion le permettent
      - gpt-oss:20b
      - llama3.1:8b
      - qwen2.5:7b-instruct
      - mistral:7b-instruct
      - llama3.2:3b
  api:
    fournisseur: groq
    url: https://api.groq.com/openai/v1
    modele: openai/gpt-oss-20b    # mêmes poids ouverts (Apache 2.0) que gpt-oss:20b (Ollama)
    # llama-3.1-8b-instant n'est plus proposé par Groq pour ce compte (liste vérifiée par scripts/tester_groq.py --lister)
    modele_borne_haute: openai/gpt-oss-120b       # borne haute de qualité, NON déployable sur le poste de la Cellule
    cle_env: GROQ_API_KEY         # la clé est lue dans cette variable d'environnement, jamais écrite dans le code
    delai_max_s: 120
    essais_reseau: 3              # nouvelles tentatives en cas de coupure (attente croissante)
    attente_base_s: 2
    intervalle_min_s: 2.1         # file d'attente : espacement minimal entre deux appels (compte gratuit)
    cache: data/cache/llm         # cache disque : un appel réussi n'est jamais refait
  gguf: models/llm/modele.gguf    # repli llama-cpp-python

# ---------------------------------------------------------------------
#  Service 4 : note stratégique (3.5.2 à 3.5.4)
# ---------------------------------------------------------------------
note_strategique:
  nb_min: 5
  nb_max: 7
  historique_min: 3               # < 3 points : |var_rel| seul
  bonus_objectif: 1.0
  tendance_meme_signe: 3          # même signe sur 3 exercices = tendance
  max_mots: 900                   # ~2 pages
  seuil_objectif: 0.12            # similarité minimale pour rattacher un objectif documenté

note_analyse:
  accepter_non_valides: true      # démonstration : commentaires non validés, signalés

# ---------------------------------------------------------------------
#  Évaluation (2.4)
# ---------------------------------------------------------------------
evaluation:
  exercice: 2024
  exercice_secondaire: 2023
  k_succes: [1, 5]
  plis_calibration: 5
  nb_indicateurs_llm: 20
  echantillon_relecture: 30
  criteres:
    h1_succes5: 0.80
    h2_tfr_max: 0.05
    h2_couv_ind_min: 0.80
    h3_reduction_temps: 0.50
    h3_part_notes_conformes: 0.80
    h3_criteres_min: 4
    h3_moyenne_bn: 1.5

# ---------------------------------------------------------------------
#  Identité visuelle de l'interface et des documents Word
# ---------------------------------------------------------------------
interface:
  nom: "ANALYS'PME"
  sous_titre: "Assistant d'analyse des publications statistiques des PMEESA"
  structure: "MINPMEESA — Cellule des Statistiques"
  # Logo officiel : fichier PNG fourni par la Cellule, déposé à cet emplacement.
  # S'il est absent, l'interface affiche le nom seul (aucun logo n'est inventé).
  logo: assets/logo.png
  couleurs:                       # couleurs nationales du Cameroun
    vert: "#007A5E"
    rouge: "#CE1126"
    jaune: "#FCD116"
    fond_doux: "#F2F7F5"
    texte: "#1F2A2E"
