# =====================================================================
#  Configuration du prototype MINPMEESA (mémoire v5, chapitres 2 et 3)
#  Tout paramètre expérimental vit ici. Le code n'a aucune valeur en dur.
#  Modifier ce fichier suffit à rejouer une variante d'expérience.
# =====================================================================

graine: 42                           # graine unique (reproductibilité)

chemins:
  corpus: data/corpus
  base: data/base/minpmeesa.sqlite   # base SQLite (reconstructible)
  index: data/base/index             # index FAISS et BM25 persistants
  modeles: models                    # modèles téléchargés (hors Git)
  lexique: data/lexique/synonymes.yaml
  appariement: data/pairing
  gold: data/gold
  resultats: data/results
  sorties: data/outputs

# ---------------------------------------------------------------------
#  Ingestion (section 2.3.3 et 3.2.1)
# ---------------------------------------------------------------------
ingestion:
  passage_min_tokens: 400            # taille cible basse d'un passage de texte
  passage_max_tokens: 800            # taille cible haute
  recouvrement: 0.15                 # recouvrement entre passages (10-20 %)
  passage_min_absolu: 40             # en deçà, un reliquat est fusionné au précédent
  titre_courant_ratio: 0.5           # ligne répétée sur >= 50 % des pages = titre courant

# ---------------------------------------------------------------------
#  Encodeur dense (Tableau 3.3)
# ---------------------------------------------------------------------
embeddings:
  modele: "BAAI/bge-m3"              # principal
  candidats:
    - "BAAI/bge-m3"
    - "intfloat/multilingual-e5-large"
    - "dangvantuan/sentence-camembert-base"
    - "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  repli: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  taille_lot: 16
  longueur_max: 512                  # tokens tronqués à l'encodage

# ---------------------------------------------------------------------
#  Récupération hybride (section 3.2.5)
# ---------------------------------------------------------------------
recherche:
  k_lexical: 50                      # candidats BM25
  k_dense: 50                        # candidats denses
  rrf_k: 60                          # constante de fusion RRF (ablation : 10, 20, 60)
  rrf_k_ablation: [10, 20, 60]
  top_n: 5                           # passages restitués
  expansion_lexique: true            # expansion sur la requête lexicale seulement
  poids_expansion: 0.1               # poids des termes ajoutés ; 1 = poids plein, qui dégrade la recherche
                                     # (ablation dans run_all ; valeur choisie sur le jeu d'évaluation lui-même)
  expansions_max_par_terme: 4

consultation:
  # Seuil d'abstention sur le meilleur score BM25 de la requête (non étendue).
  # Valeur calibrée par minpmeesa.evaluation.calibration sur les questions hors
  # corpus du jeu de consultation. Voir data/results/<date>/calibration.json.
  signal_abstention: bm25_max
  seuil_abstention: 8.0
  reponse_redigee: false             # réponse rédigée courte (facultative)

# ---------------------------------------------------------------------
#  Modèle de langage (Tableau 3.2)
# ---------------------------------------------------------------------
llm:
  moteur: ollama                     # ollama | llama_cpp | none
  modele: "qwen2.5:7b-instruct-q4_K_M"
  candidats:
    - "qwen2.5:3b-instruct-q4_K_M"
    - "qwen2.5:7b-instruct-q4_K_M"
    - "llama3.2:3b-instruct-q4_K_M"
    - "mistral:7b-instruct-q4_K_M"
    - "phi3.5:3.8b-mini-instruct-q4_K_M"
  hote: "http://127.0.0.1:11434"     # Ollama local (boucle locale uniquement)
  gguf: ""                           # chemin d'un .gguf pour llama-cpp-python (repli)
  temperature: 0
  max_tokens: 700
  delai_max_s: 180
  nouvelles_tentatives_json: 1       # JSON invalide : 1 nouvelle tentative, puis abstention

# ---------------------------------------------------------------------
#  Commentaire d'un indicateur (section 3.3)
# ---------------------------------------------------------------------
commentaire:
  decimales_pourcentage: 1           # convention : 1 décimale pour les %
  decimales_absolue: 0               # variations absolues arrondies à l'unité
  modeles_redaction_max: 3           # commentaires antérieurs fournis comme modèles
  valeurs_max_contexte: 250          # valeurs du tableau apparié au plus dans le contexte (tableau entier)
  variations_max_contexte: 40        # variations au plus dans le contexte
  annees_exclues: [2010, 2035]       # bornes des millésimes non contrôlés (R1)

# ---------------------------------------------------------------------
#  Note stratégique (sections 3.5.2 à 3.5.4)
# ---------------------------------------------------------------------
strategique:
  n_min: 5
  n_max: 7
  historique_min_volatilite: 3       # < 3 points : |var_rel| seul
  bonus_objectif: 0.5                # bonus si un objectif est documenté
  tendance_meme_signe: 3             # même signe sur 3 exercices = tendance
  seuil_rattachement_objectif: 0.20  # similarité lexicale minimale indicateur/objectif
  pages_max: 2
  mots_par_page: 500                 # approximation d'une page Word (BN5)

# ---------------------------------------------------------------------
#  Évaluation (chapitre 2.4)
# ---------------------------------------------------------------------
evaluation:
  exercice_evalue: 2024
  exercice_secondaire: 2023
  criteres:
    h1_succes5_min: 0.80
    h1_p_max: 0.05
    h2_tfr_max: 0.05
    h2_couv_ind_min: 0.80
    h3_reduction_temps_min: 0.50
    h3_part_notes_min: 0.80
    h3_criteres_min: 4
    h3_moyenne_bn_min: 1.5
  echantillon_relecture_h2: 30
  indicateurs_choix_modele: 20
