# Thème de l'interface (couleurs nationales ; voir config.yaml, section interface)
[theme]
base = "light"
primaryColor = "#00A35C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F7F5"
textColor = "#13261F"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
